<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Reset password — THE VERGE</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f6f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(440px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:28px;box-shadow:0 20px 70px rgba(15,23,42,.08)}
    .mark{width:42px;height:42px;border-radius:12px;background:#111827;color:white;display:grid;place-items:center;font-weight:800;margin-bottom:18px}
    h1{margin:0 0 8px;font-size:26px}p{color:#6b7280;margin:0 0 22px;line-height:1.55}
    label{display:block;font-weight:650;margin:14px 0 6px}input{width:100%;padding:12px 13px;border:1px solid #d1d5db;border-radius:10px;font:inherit}
    button{width:100%;margin-top:18px;padding:12px 14px;border:0;border-radius:10px;background:#111827;color:white;font:inherit;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}.message{margin-top:16px;padding:12px;border-radius:10px;background:#f3f4f6;color:#374151;display:none}.message.error{background:#fef2f2;color:#991b1b}
    a{color:#111827}
  </style>
</head>
<body>
<main>
  <div class="mark">V</div>
  <h1>Reset your password</h1>
  <p>Choose a new password for your THE VERGE account. Reset links expire after 30 minutes and can only be used once.</p>
  <form id="form">
    <label for="password">New password</label>
    <input id="password" name="password" type="password" minlength="10" maxlength="200" autocomplete="new-password" required />
    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" minlength="10" maxlength="200" autocomplete="new-password" required />
    <button id="submit" type="submit">Reset password</button>
  </form>
  <div id="message" class="message" role="status" aria-live="polite"></div>
</main>
<script>
const token=new URLSearchParams(location.search).get('token')||'';
if(token) history.replaceState({},document.title,'/reset-password.html');
const form=document.getElementById('form'),button=document.getElementById('submit'),message=document.getElementById('message');
function show(text,error=false){message.textContent=text;message.className='message'+(error?' error':'');message.style.display='block'}
if(!token){show('This reset link is missing its token. Request a new password reset from THE VERGE.',true);button.disabled=true}
form.addEventListener('submit',async(event)=>{
  event.preventDefault();
  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirm').value;
  if(password!==confirm){show('The passwords do not match.',true);return}
  button.disabled=true;show('Resetting your password…');
  try{
    const res=await fetch('/api/auth/reset-password',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.error==='invalid_reset_token'?'This reset link is invalid or has expired.':'The password could not be reset.');
    show('Password reset successfully. You can return to THE VERGE and sign in with your new password.');
    form.reset();
  }catch(error){show(error instanceof Error?error.message:'The password could not be reset.',true);button.disabled=false}
});
</script>
</body>
</html>
