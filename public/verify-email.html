<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Verify email — THE VERGE</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f6f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(460px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:30px;box-shadow:0 20px 70px rgba(15,23,42,.08)}
    .mark{width:44px;height:44px;border-radius:12px;background:#111827;color:white;display:grid;place-items:center;font-weight:800;margin-bottom:18px}
    h1{margin:0 0 8px;font-size:27px}p{color:#6b7280;line-height:1.6}.message{margin:18px 0;padding:13px;border-radius:10px;background:#f3f4f6;color:#374151}
    .message.error{background:#fef2f2;color:#991b1b}a{display:inline-flex;padding:11px 14px;border-radius:10px;background:#111827;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
<main>
  <div class="mark">V</div>
  <h1>Verify your email</h1>
  <p>We’re confirming the email address attached to your THE VERGE account.</p>
  <div id="message" class="message" role="status" aria-live="polite">Checking verification link…</div>
  <a id="return" href="/" hidden>Return to THE VERGE</a>
</main>
<script>
const token=new URLSearchParams(location.search).get('token')||'';
if(token)history.replaceState({},document.title,'/verify-email.html');
const message=document.getElementById('message'),back=document.getElementById('return');
function show(text,error=false){message.textContent=text;message.className='message'+(error?' error':'');back.hidden=false}
(async()=>{
  if(!token){show('This verification link is missing its token. Return to THE VERGE and request a new verification email.',true);return}
  try{
    const res=await fetch('/api/auth/verify-email',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.error==='invalid_verification_token'?'This verification link is invalid or has expired. Request a new one from THE VERGE.':'Your email could not be verified right now.');
    show('Email verified successfully. Your account can now use security-sensitive features.');
  }catch(error){show(error instanceof Error?error.message:'Your email could not be verified right now.',true)}
})();
</script>
</body>
</html>
